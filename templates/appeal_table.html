<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appeal Management — Let’sConnect</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body {
    font-family: Inter, system-ui;
    background: radial-gradient(circle at top left,#0b1020,#020617);
    color: #eaf2ff;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }

  h1 {
    font-size: 26px;
    margin-bottom: 20px;
    background: linear-gradient(90deg,#7c3aed,#06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  table {
    border-collapse: collapse;
    width: 80%;
    max-width: 900px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(124,58,237,0.2);
  }

  th, td {
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px;
    text-align: left;
  }

  th {
    background: rgba(255,255,255,0.08);
    color: #06b6d4;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  tr:hover {
    background: rgba(124,58,237,0.15);
  }

  button {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
    margin-right: 6px;
  }

  .unban {
    background: linear-gradient(90deg,#06b6d4,#7c3aed);
    color: white;
  }

  .chat {
    background: linear-gradient(90deg,#22c55e,#16a34a);
    color: white;
  }

  button:hover {
    box-shadow: 0 0 10px rgba(6,182,212,0.4);
    transform: translateY(-1px);
  }

  p {
    color: #9aa6bd;
    font-size: 14px;
    margin-top: 25px;
  }
</style>
</head>
<body>
  <h1>Pending Appeals</h1>

  <table id="appealsTable">
    <tr>
      <th>User</th>
      <th>Reason</th>
      <th>Submitted On</th>
      <th>Actions</th>
    </tr>
    {% for u, info in appeals.items() %}
    <tr>
      <td>{{ u }}</td>
      <td>{{ info.reason }}</td>
      <td>{{ info.timestamp }}</td>
      <td>
        <button class="chat" onclick="openChat('{{ u }}')">💬 Chat</button>
        <button class="unban" onclick="unbanUser('{{ u }}')">Unban</button>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" style="text-align:center;color:#9aa6bd;">No pending appeals yet.</td></tr>
    {% endfor %}
  </table>

  <p>Click <strong>Chat</strong> to talk with the user before unbanning.</p>

<script>
async function unbanUser(username) {
  const res = await fetch('/unban_user', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username})
  });
  const data = await res.json();
  if (data.status === 'success') {
    alert(`✅ ${username} unbanned successfully!`);
    location.reload();
  } else {
    alert(`❌ Failed: ${data.message}`);
  }
}

 function openChat(user) {
  window.location = `/appeal_chat/${user}`;
}

</script>
</body>
</html>
